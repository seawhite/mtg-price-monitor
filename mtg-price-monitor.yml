version: "3.8"

services:
  backend:
    image: seawhite/mtg-price-monitor-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtg-monitor-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - /docker/mtg-price-monitor/data:/app/data
    env_file:
      - mtg-price-monitor.env
    environment:
      - DATABASE_URL=sqlite:///data/monitors.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: seawhite/mtg-price-monitor-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtg-monitor-frontend
    restart: unless-stopped
    ports:
      - "6088:3000"
    depends_on:
      - backend
